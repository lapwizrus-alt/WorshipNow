name: Build Windows installer

# Builds an unsigned WorshipNow installer for Windows and attaches it to a
# "Test build" release on this repository (Releases page) for easy download.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package installer (unsigned)
        run: npx electron-builder --config config/building/electron-builder.yaml --win --x64 --publish never

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorshipNow-Windows-installer
          path: dist/*.exe
          retention-days: 30

      - name: Publish test build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: WorshipNow test build ${{ github.run_number }}
          prerelease: true
          body: |
            Unsigned test build of WorshipNow for Windows, built from commit ${{ github.sha }}.
            Windows SmartScreen will warn because the installer isn't code-signed: click "More info" then "Run anyway".
          files: dist/*.exe
